name: Natives

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    name: Build xkbcommon for ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: osx
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install meson and ninja
        run: python -m pip install --upgrade meson ninja

      - name: Install bison (Windows)
        if: runner.os == 'Windows'
        run: choco install -y winflexbison3

      - name: Install bison (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: |
          brew install bison
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./eng/build-natives.ps1 -Rid ${{ matrix.rid }}

      - name: Build (macOS, universal)
        if: runner.os == 'macOS'
        run: sh eng/build-natives.sh osx

      - name: Check both architectures are in the binary
        if: runner.os == 'macOS'
        run: |
          set -eu
          binary=$(ls runtimes/osx/native/*.dylib)
          lipo -info "$binary"
          lipo -info "$binary" | grep -q arm64
          lipo -info "$binary" | grep -q x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: runtimes/${{ matrix.rid }}/native/*
          if-no-files-found: error

  pack:
    name: Pack with every runtime
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: staging

      - name: Lay the runtimes out
        run: |
          set -eu
          for rid in win-x64 osx; do
            mkdir -p "runtimes/$rid/native"
            cp -a "staging/native-$rid/." "runtimes/$rid/native/"
          done
          find runtimes -type f | sort

      - name: Pack
        run: dotnet pack src/Xkb.NET/Xkb.NET.csproj -c Release -o artifacts

      - name: Check the package carries both runtimes
        run: |
          set -eu
          pkg=$(ls artifacts/*.nupkg | head -1)
          unzip -l "$pkg" | grep -E 'runtimes/(win-x64|osx)/native/' | sort
          for rid in win-x64 osx; do
            unzip -l "$pkg" | grep -q "runtimes/$rid/native/" || {
              echo "$pkg carries no $rid payload" >&2
              exit 1
            }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*.nupkg
          if-no-files-found: error